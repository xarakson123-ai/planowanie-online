<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planowanie — Oh Hell Online</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#0f172a;color:#e5e7eb;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#111827;border:1px solid #263244;border-radius:18px;padding:22px;box-shadow:0 15px 45px rgba(0,0,0,.25)}h1{margin:0 0 6px;font-size:36px}.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 16px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#374151}.btn:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#0b1220;color:#fff}.roomcode{font-size:30px;font-weight:900;letter-spacing:5px}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.player{background:#0b1220;padding:12px;border-radius:12px}.table{display:grid;grid-template-columns:1fr 280px 1fr;gap:16px;align-items:center}.center{text-align:center}.trick{min-height:220px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot{background:#0b1220;border-radius:14px;padding:12px;text-align:center;min-height:90px}.cards{display:flex;flex-wrap:wrap;gap:10px}.cardc{width:78px;height:108px;border-radius:12px;background:#f8fafc;color:#111827;border:3px solid #e5e7eb;display:flex;flex-direction:column;justify-content:space-between;padding:8px;font-weight:900;cursor:pointer}.cardc.red{color:#b91c1c}.cardc:hover{transform:translateY(-4px)}.hidden{display:none}.msg{padding:10px;border-radius:10px;background:#3f1d1d;color:#fecaca;margin:10px 0}.score{width:100%;border-collapse:collapse}.score td,.score th{padding:8px;text-align:left;border-bottom:1px solid #263244}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1f2937}.hero{padding:32px 0}.small{font-size:13px}@media(max-width:800px){.grid,.table{grid-template-columns:1fr}.players{grid-template-columns:1fr 1fr}.cardc{width:67px;height:98px}}
</style></head><body><div class="wrap"><div id="home" class="hero"><div class="card"><h1>♠ Planowanie</h1><p class="muted">Oh Hell — karciana gra online dla 2–4 osób.</p><div class="grid"><div><label>Twoje imię</label><input id="name" placeholder="Np. Kuba" maxlength="18"></div><div><label>Kod pokoju</label><input id="code" placeholder="Np. A1B2C3" maxlength="6"></div></div><br><div class="actions"><button class="btn" id="create">Utwórz pokój</button><button class="btn alt" id="join">Dołącz do pokoju</button></div><div id="err"></div></div></div>
<div id="lobby" class="hidden"><div class="card"><h1>Pokój <span class="roomcode" id="roomCode"></span></h1><p class="muted">Wyślij kod znajomym. Gdy dołączą, twórca pokoju rozpoczyna grę.</p><div class="players" id="players"></div><br><button class="btn" id="start">Rozpocznij grę</button><div id="lobbymsg"></div></div></div>
<div id="game" class="hidden"><div class="card"><div class="actions" style="justify-content:space-between"><div><b>Runda <span id="round"></span>/7</b> <span class="pill">Atut: <span id="trump"></span></span></div><div id="phase"></div></div><hr style="border-color:#263244"><div class="table"><div><h3>Gracze</h3><table class="score"><tbody id="score"></tbody></table></div><div class="center"><div class="trick" id="trick"></div></div><div><h3>Twoja deklaracja</h3><div id="decl"></div><h3>Twoja ręka</h3><div class="cards" id="hand"></div></div></div></div></div></div>
<script src="config.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>
const serverUrl = window.PLANOWANIE_SERVER || window.location.origin;
const s=io(serverUrl, { transports:["websocket","polling"] }); let myId=null, creator=false; const $=id=>document.getElementById(id); function show(id){['home','lobby','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
$('create').onclick=()=>s.emit('createRoom',{name:$('name').value.trim()||'Gracz'}); $('join').onclick=()=>s.emit('joinRoom',{code:$('code').value.trim(),name:$('name').value.trim()||'Gracz'}); $('start').onclick=()=>s.emit('startGame');
s.on('connect',()=>myId=s.id); s.on('roomCreated',c=>{creator=true; $('roomCode').textContent=c; show('lobby')}); s.on('errorMsg',m=>{$('err').textContent=m; $('err').className='msg';});
function cardHtml(c,i,enabled){const red=c.s==='♥'||c.s==='♦'; return `<button class="cardc ${red?'red':''}" data-i="${i}" ${enabled?'':'disabled'}><span>${c.r}</span><span>${c.s}</span></button>`}
s.on('state',st=>{ $('err').textContent=''; if(st.room.phase==='lobby'){show('lobby');$('roomCode').textContent=st.room.code; $('players').innerHTML=st.room.players.map((p,i)=>`<div class="player"><b>${p.name}</b><br><span class="muted">${i+1}. miejsce</span></div>`).join(''); $('start').disabled=st.myId!==st.room.players[0]?.id||st.room.players.length<2; return;} show('game'); const r=st.room; $('round').textContent=r.round>7?7:r.round; $('trump').textContent=r.trump||'—'; $('score').innerHTML=r.players.map(p=>`<tr><td>${p.name}</td><td>${p.score} pkt</td><td>${p.decl==null?'—':p.decl}</td><td>${p.won||0}</td></tr>`).join(''); $('phase').textContent=r.phase==='declaration'?'Deklaracje':r.phase==='play'?(r.currentPlayer===myId?'Twoja kolej':'Czekaj na ruch'):(r.phase==='finished'?'Koniec partii':'Podsumowanie rundy'); const my=st.players?.find?.(()=>false); if(r.phase==='declaration' && r.players.find(p=>p.id===myId)?.decl==null){const me=r.players.find(p=>p.id===myId); const taken=r.players.filter(p=>p.decl!==null).reduce((a,p)=>a+p.decl,0); const opts=[]; for(let n=0;n<=r.handSize;n++){if(r.players.length===2 && taken+n===r.handSize)continue;opts.push(`<button class="btn alt declbtn" data-n="${n}">${n}</button>`)} $('decl').innerHTML=`<p>Wybierz liczbę lew:</p><div class="actions">${opts.join('')}</div>`; document.querySelectorAll('.declbtn').forEach(b=>b.onclick=()=>s.emit('declare',Number(b.dataset.n))); } else $('decl').textContent=r.players.find(p=>p.id===myId)?.decl??'—'; $('hand').innerHTML=st.hand.map((c,i)=>cardHtml(c,i,r.phase==='play'&&r.currentPlayer===myId && (!st.trick.length || st.hand.some(x=>x.s===st.trick[0].card.s)))) .join(''); document.querySelectorAll('.cardc').forEach(b=>b.onclick=()=>s.emit('play',st.hand[Number(b.dataset.i)])); $('trick').innerHTML=st.trick.map(t=>`<div class="slot"><b>${r.players.find(p=>p.id===t.player)?.name||''}</b><br><strong style="font-size:32px">${t.card.r}${t.card.s}</strong></div>`).join('') || '<div class="slot">Lewy jeszcze nie ma</div><div class="slot">&nbsp;</div>'; if(r.phase==='finished'){setTimeout(()=>alert('Koniec partii! Sprawdź wynik punktowy.'),50)}});
</script></body></html>
