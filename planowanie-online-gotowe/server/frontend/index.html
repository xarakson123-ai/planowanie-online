<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planowanie — Online</title><style>
:root{--bg:#0b1220;--panel:#121d30;--line:#2b3a52;--text:#edf2f7;--muted:#94a3b8;--blue:#60a5fa;--gold:#f7c948;--paper:#f5eedf;--ink:#2a241c;--red:#d95858}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#203556,#0b1220 62%);color:var(--text);font-family:system-ui,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:rgba(18,29,48,.96);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 50px #0004}.home{max-width:820px;margin:70px auto}.home h1{font-size:48px;margin:0}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:14px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#0a1322;color:#fff}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--blue);font-weight:800;cursor:pointer}.btn.dark{background:#26344a;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.badge{padding:7px 10px;border-radius:999px;background:#1d2b40;color:#cfe4ff}.lobbyPlayers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.pl{background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:13px}.gamegrid{display:grid;grid-template-columns:1fr 340px;gap:15px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.trump{font-size:30px}.red{color:#ef4444}.hand{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.playing{width:75px;height:112px;background:#fbfaf7;color:#111;border:2px solid #ded7c9;border-radius:11px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-weight:900;box-shadow:0 7px 17px #0004;cursor:pointer}.playing:hover{transform:translateY(-4px)}.playing.disabled{opacity:.35;cursor:not-allowed;transform:none}.playing .big{font-size:28px}.table{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table .slot{min-height:130px;background:#0a1322;border:1px dashed #43546e;border-radius:14px;padding:10px;text-align:center}.paper{background:linear-gradient(180deg,#faf3e4,#efe4c9);color:var(--ink);border-radius:7px;padding:17px;box-shadow:0 13px 24px #0005;transform:rotate(.3deg);border:1px solid #d2c5a9}.paper h3{margin:0 0 10px;font-family:Georgia,serif}.paper table{width:100%;border-collapse:collapse;font-family:Georgia,serif;font-size:13px}.paper th,.paper td{padding:6px;border-bottom:1px dashed #c4b79c;text-align:center}.paper th{font-weight:900}.paper .total{font-weight:900}.status{padding:11px;border-radius:10px;background:#0a1322;color:#cdd8e7;margin-bottom:11px}.error{background:#481d22;color:#fecaca}.phase{padding:25px;text-align:center;background:#0a1322;border-radius:14px;border:1px dashed #43546e;margin-bottom:12px}.phase h2{margin-top:0}.log{max-height:150px;overflow:auto;color:#9fb0c4;font-size:12px;margin-top:10px}.rules{font-size:12px;color:#77879a;margin-top:16px}@media(max-width:950px){.gamegrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.lobbyPlayers{grid-template-columns:1fr 1fr}}@media(max-width:560px){.playing{width:62px;height:94px}.hand{gap:7px}}
</style></head><body><div class="wrap"><section id="home" class="panel home"><h1>♠ Planowanie</h1><p class="muted">Oh Hell / Windykacja — pełna talia, pokoje online i kartka do zapisywania lew.</p><div class="grid"><div class="field"><label>Twoje imię</label><input id="name" maxlength="18" placeholder="np. Kuba"></div><div class="field"><label>Kod pokoju (przy dołączaniu)</label><input id="code" maxlength="6" placeholder="np. A1B2C3"></div></div><div class="row" style="margin-top:15px"><button class="btn" id="create">Utwórz pokój</button><button class="btn dark" id="join">Dołącz do pokoju</button></div><p id="homeError"></p></section>
<section id="lobby" class="hidden"><div class="panel"><div class="top"><div><h2 style="margin:0">Pokój <span id="roomCode"></span></h2><p class="muted">Podaj kod znajomym.</p></div><span class="badge">2–4 graczy</span></div><div class="lobbyPlayers" id="lobbyPlayers"></div><div class="status" id="lobbyStatus"></div><div class="row"><button class="btn" id="start">Rozpocznij grę</button><button class="btn dark" id="copy">Kopiuj kod</button></div></div></section>
<section id="game" class="hidden"><div class="top"><div><h2 style="margin:0">♠ Planowanie</h2><span class="muted">Runda <b id="round"></b></span></div><div class="badge">Atut: <span id="trump" class="trump"></span></div></div><div class="gamegrid"><main><div class="panel"><div class="bar"><div><b id="phase"></b></div><div class="status" style="margin:0">Twoja deklaracja: <b id="myDecl">—</b></div></div><div id="declArea"></div><div id="playArea"></div></div><div class="panel" style="margin-top:15px"><h3 style="margin-top:0">Twoja ręka</h3><div id="hand" class="hand"></div><div id="handMsg" class="muted" style="margin-top:10px"></div></div></main><aside><div class="paper"><h3>📄 Kartka wyników</h3><table><thead><tr><th>Gracz</th><th>Licz.</th><th>Lewy</th><th>Pkt</th></tr></thead><tbody id="sheet"></tbody></table></div><div class="panel" style="margin-top:15px"><h3 style="margin-top:0">Stół</h3><div id="trick" class="table"></div><div class="log" id="log"></div></div></aside></div></section></div><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="config.js"></script><script>
const SERVER=window.PLANOWANIE_SERVER||location.origin;const socket=io(SERVER,{transports:['websocket','polling']});let myId=null;let isCreator=false;let last=null;const $=id=>document.getElementById(id);function show(id){['home','lobby','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
socket.on('connect',()=>myId=socket.id);socket.on('roomCreated',code=>{isCreator=true;$('roomCode').textContent=code;show('lobby')});socket.on('errorMsg',m=>{for(const id of ['homeError','lobbyStatus','handMsg']){if($(id)){$(id).textContent=m;if(id!=='handMsg')$(id).className='status error';}}});
$('create').onclick=()=>socket.emit('createRoom',{name:$('name').value.trim()||'Gracz'});$('join').onclick=()=>socket.emit('joinRoom',{code:$('code').value.trim(),name:$('name').value.trim()||'Gracz'});$('start').onclick=()=>socket.emit('startGame');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('roomCode').textContent);$('lobbyStatus').textContent='Kod skopiowany.'}catch{}};
function card(c,enabled){const d=document.createElement('button');d.className='playing '+((c.s==='♥'||c.s==='♦')?'red':'');d.innerHTML='<span>'+c.r+'</span><span class="big">'+c.s+'</span>';d.disabled=!enabled;if(!enabled)d.classList.add('disabled');d.onclick=()=>socket.emit('play',{s:c.s,r:c.r});return d}
function legal(hand,trick,c){if(!trick.length)return true;const lead=trick[0].card.s;return !hand.some(x=>x.s===lead)||c.s===lead}
function render(st){last=st;const r=st.room;if(r.phase==='lobby'){show('lobby');$('roomCode').textContent=r.code;$('lobbyPlayers').innerHTML=r.players.map((p,i)=>'<div class="pl"><b>'+esc(p.name)+'</b><br><span class="muted">'+(i===0?'Gospodarz':'Gracz')+'</span></div>').join('');$('lobbyStatus').textContent=r.players.length===4?'Komplet 4/4 — można zaczynać!':'Gracze: '+r.players.length+'/4';$('start').disabled=false;return}show('game');$('round').textContent=r.round+' / '+r.maxRounds;$('trump').textContent=r.trump||'—';$('trump').className='trump '+((r.trump==='♥'||r.trump==='♦')?'red':'');const me=r.players.find(p=>p.id===myId);$('phase').textContent=r.phase==='declaration'?'Deklaracje':r.phase==='play'?(r.currentPlayer===myId?'Twoja kolej':'Czekaj na ruch'):(r.phase==='finished'?'Koniec partii':'Koniec rundy');$('myDecl').textContent=me?.decl??'—';
$('sheet').innerHTML=r.players.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+r.handSize+'</td><td>'+((p.won)||0)+'</td><td class="total">'+p.score+'</td></tr>').join('');
const da=$('declArea');da.innerHTML='';if(r.phase==='declaration'&&r.currentDeclarer===myId&&me.decl===null){let b='';for(let n=0;n<=r.handSize;n++)b+='<button class="btn dark decl" data-n="'+n+'" style="margin:3px">'+n+'</button>';da.innerHTML='<p>Twoja kolej deklaracji. Wybierz liczbę lew:</p>'+b;document.querySelectorAll('.decl').forEach(x=>x.onclick=()=>socket.emit('declare',Number(x.dataset.n)));}else if(r.phase==='declaration'){da.innerHTML='<div class="phase"><h2>Czekaj na deklarację</h2><p>Gracz '+esc(r.players.find(p=>p.id===r.currentDeclarer)?.name||'')+' deklaruje.</p></div>';}else if(r.phase==='roundEnd'){da.innerHTML='<div class="phase"><h2>Runda zakończona</h2><p>Wyniki zapisane na kartce. Następna runda zaraz się rozpocznie.</p></div>';}else if(r.phase==='finished'){const top=[...r.players].sort((a,b)=>b.score-a.score)[0];da.innerHTML='<div class="phase"><h2>🏆 '+esc(top?.name||'')+' wygrywa!</h2><p>Końcowy wynik: '+(top?.score||0)+' pkt.</p></div>'}
const hand=$('hand');hand.innerHTML='';if(r.phase==='play'){st.hand.forEach(c=>hand.appendChild(card(c,r.currentPlayer===myId&&legal(st.hand,r.trick,c))));$('handMsg').textContent=r.currentPlayer===myId?'Kliknij kartę, którą chcesz zagrać. Musisz dokładać do koloru.':'Poczekaj na swoją kolej.';}else{st.hand.forEach(c=>hand.appendChild(card(c,false)));$('handMsg').textContent='';}
$('trick').innerHTML=r.trick.length?r.trick.map(t=>'<div class="slot"><b>'+esc(r.players.find(p=>p.id===t.player)?.name||'')+'</b><br><span style="font-size:34px">'+t.card.r+t.card.s+'</span></div>').join(''):'<div class="slot" style="grid-column:1/-1">Stół jest pusty.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
socket.on('state',render);
</script></body></html>
