<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planowanie Online</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#111827;border:1px solid #263244;border-radius:18px;padding:20px}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#0b1220;color:white}.btn{border:0;border-radius:10px;padding:12px 16px;background:#2563eb;color:white;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4}.actions{display:flex;gap:8px;flex-wrap:wrap}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.player{background:#0b1220;padding:12px;border-radius:10px}.hand{display:flex;gap:8px;flex-wrap:wrap}.card{width:72px;height:102px;background:#fff;color:#111827;border:3px solid #ddd;border-radius:12px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-weight:900}.card.red{color:#b91c1c}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:8px;border-bottom:1px solid #263244;text-align:left}.hidden{display:none}.err{margin-top:10px;background:#4c1d1d;color:#fecaca;padding:10px;border-radius:10px}.trick{display:flex;gap:10px;flex-wrap:wrap}.slot{background:#0b1220;padding:14px;border-radius:12px;text-align:center;min-width:100px}@media(max-width:700px){.grid{grid-template-columns:1fr}.players{grid-template-columns:1fr 1fr}.card{width:64px;height:92px}}</style></head><body><div class="wrap"><section id="home" class="card"><h1>♠ Planowanie</h1><p>Gra karciana online dla 2–4 osób.</p><div class="grid"><div><label>Imię</label><input id="name" maxlength="18" placeholder="Np. Kuba"></div><div><label>Kod pokoju</label><input id="code" maxlength="6" placeholder="A1B2C3"></div></div><br><div class="actions"><button class="btn" id="create">Utwórz pokój</button><button class="btn" id="join">Dołącz</button></div><div id="err"></div></section><section id="lobby" class="card hidden"><h1>Pokój <span id="roomCode"></span></h1><p>Udostępnij kod znajomym.</p><div id="players" class="players"></div><br><button id="start" class="btn">Rozpocznij grę</button><div id="lobbyErr"></div></section><section id="game" class="card hidden"><h2>Runda <span id="round"></span> · Atut <span id="trump"></span></h2><p id="phase"></p><table class="table"><thead><tr><th>Gracz</th><th>Wynik</th><th>Deklaracja</th><th>Lewy</th></tr></thead><tbody id="score"></tbody></table><h3>Stół</h3><div id="trick" class="trick"></div><h3 id="declTitle">Deklaracja</h3><div id="decl" class="actions"></div><h3>Twoje karty</h3><div id="hand" class="hand"></div><div id="gameErr"></div></section></div><script src="config.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>const $=id=>document.getElementById(id);const SERVER=window.PLANOWANIE_SERVER;const socket=io(SERVER,{transports:['websocket','polling']});let myId=localStorage.getItem('planowaniePlayerId')||crypto.randomUUID();localStorage.setItem('planowaniePlayerId',myId);let state=null;function show(x){['home','lobby','game'].forEach(id=>$(id).classList.toggle('hidden',id!==x))}function err(t){$('err').textContent=t||'';$('lobbyErr').textContent=t||'';$('gameErr').textContent=t||'';}
$('create').onclick=()=>socket.emit('createRoom',{name:$('name').value.trim()||'Gracz',token:myId});$('join').onclick=()=>socket.emit('joinRoom',{code:$('code').value.trim(),name:$('name').value.trim()||'Gracz',token:myId});$('start').onclick=()=>socket.emit('startGame');socket.on('roomCreated',c=>{show('lobby');$('roomCode').textContent=c});socket.on('errorMsg',err);
socket.on('state',st=>{state=st;myId=st.myId;localStorage.setItem('planowaniePlayerId',myId);const r=st.room;if(r.phase==='lobby'){show('lobby');$('roomCode').textContent=r.code;$('players').innerHTML=r.players.map((p,i)=>`<div class="player"><b>${p.name}</b><br>${i===0?'👑 Gospodarz':'Gracz '+(i+1)}<br><small>${p.connected?'🟢 online':'🟡 łączenie...'}</small></div>`).join('');$('start').disabled=!(r.players[0]?.id===myId&&r.players.length>=2);return}show('game');$('round').textContent=r.round;$('trump').textContent=r.trump?`${r.trump.r}${r.trump.s}`:'—';$('phase').textContent=r.phase==='declaration'?(r.currentDeclarer===myId?'🟢 Twoja kolej — wybierz deklarację':'⏳ Czekaj na deklarację'):(r.currentPlayer===myId?'🟢 Twoja kolej':'⏳ Czekaj na ruch');$('score').innerHTML=r.players.map(p=>`<tr><td>${p.name}</td><td>${p.score}</td><td>${p.decl==null?'—':p.decl}</td><td>${p.won}</td></tr>`).join('');$('trick').innerHTML=r.trick.length?r.trick.map(t=>{const p=r.players.find(x=>x.id===t.player);return `<div class="slot"><b>${p?.name||''}</b><br><strong style="font-size:30px">${t.card.r}${t.card.s}</strong></div>`}).join(''):'<div class="slot">Stół jest pusty</div>';const me=r.players.find(p=>p.id===myId);if(r.phase==='declaration'&&r.currentDeclarer===myId&&me?.decl==null){let total=r.players.reduce((a,p)=>a+(p.decl??0),0);let html='';for(let n=0;n<=r.handSize;n++)if(total+n!==r.handSize)html+=`<button class="btn" data-n="${n}">${n}</button>`;$('decl').innerHTML=html||'<span>Brak dozwolonej deklaracji.</span>';$('decl').querySelectorAll('button').forEach(b=>b.onclick=()=>socket.emit('declare',Number(b.dataset.n)))}else $('decl').innerHTML=r.phase==='declaration'?'Deklaracja zostanie udostępniona, gdy nadejdzie Twoja kolej.':(me?.decl??'—');$('hand').innerHTML=st.hand.map((c,i)=>`<button class="card ${c.s==='♥'||c.s==='♦'?'red':''}" data-i="${i}"><span>${c.r}</span><span>${c.s}</span></button>`).join('');$('hand').querySelectorAll('button').forEach(b=>b.onclick=()=>socket.emit('play',st.hand[Number(b.dataset.i)]));});</script></body></html>
