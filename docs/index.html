<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planowanie — gra karciana</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#12243a;--line:#203650;--text:#f5f7fb;--muted:#93a4ba;--blue:#4f8cff;--blue2:#2d6cdf;--green:#35c98b;--red:#ff6b6b;--gold:#f4c95d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% -10%,#17365b 0,#07111f 48%);color:var(--text)}button,input{font:inherit}.app{width:min(1100px,100%);margin:auto;padding:20px 16px 36px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#fff,#a8c7ff);color:#07111f;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 25px #0005}.status{font-size:12px;color:var(--muted)}.panel{background:linear-gradient(180deg,#102139f2,#0b1829f2);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px #0006;overflow:hidden}.pad{padding:24px}.hero{padding:42px 24px 26px;text-align:center}.hero h1{font-size:clamp(38px,9vw,68px);line-height:1;margin:0 0 10px;letter-spacing:-3px}.hero p{margin:0 auto;max-width:600px;color:var(--muted);font-size:15px}.form{display:grid;gap:14px;max-width:520px;margin:25px auto 0}.field label{display:block;color:#b9c7d8;font-size:13px;font-weight:700;margin:0 0 7px}.field input{width:100%;height:52px;padding:0 15px;border-radius:14px;border:1px solid #2a425e;background:#081423;color:#fff;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4f8cff22}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:52px;border:0;border-radius:14px;padding:0 16px;font-weight:850;cursor:pointer;color:#fff;background:linear-gradient(180deg,#5a96ff,#2d6cdf);box-shadow:0 8px 22px #2d6cdf33}.btn.secondary{background:#172a42;box-shadow:none;border:1px solid #29425f}.btn:disabled{opacity:.42;cursor:not-allowed}.message{min-height:20px;color:#ff9d9d;text-align:center;font-size:13px;margin-top:5px}.roomhead{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}.room-title{font-size:25px;font-weight:900}.roomcode{font-size:20px;letter-spacing:4px;color:var(--gold);font-weight:950}.roomsub{color:var(--muted);font-size:13px;margin-top:3px}.copy{border:1px solid #2c4562;background:#13273f;color:#fff;border-radius:11px;padding:10px 13px;cursor:pointer}.players{padding:20px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.player{min-height:118px;border:1px solid var(--line);background:#091729;border-radius:17px;padding:15px;position:relative}.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#172f4d;font-weight:900;margin-bottom:12px}.player strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player small{color:var(--muted)}.crown{position:absolute;right:12px;top:12px}.ready{color:var(--green)!important}.room-actions{padding:0 24px 24px}.game{display:grid;grid-template-columns:270px 1fr 300px;gap:16px}.side,.main{min-width:0}.box{background:#0d1b2e;border:1px solid var(--line);border-radius:20px;padding:16px}.score-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #193049;font-size:13px}.score-row:last-child{border:0}.score-row.me{color:#fff;font-weight:800}.pill{padding:4px 8px;border-radius:999px;background:#172b44;color:#c8d5e5;font-size:11px}.turn{color:var(--green)}.tablebox{min-height:510px;display:flex;flex-direction:column}.roundline{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.round{font-weight:900;font-size:18px}.trump{padding:8px 11px;border-radius:11px;background:#172b44}.table{flex:1;display:grid;place-items:center;position:relative;min-height:360px}.felt{width:min(330px,85%);aspect-ratio:1.25;background:radial-gradient(circle,#1d6a4e,#0d4a38 65%,#09352a);border:9px solid #183326;border-radius:50%;box-shadow:inset 0 0 40px #0007,0 18px 40px #0005;display:flex;justify-content:center;align-items:center;gap:10px;padding:20px}.slot{width:92px;height:126px;border-radius:13px;background:#fff;color:#101827;display:flex;flex-direction:column;justify-content:space-between;padding:9px;font-weight:900;box-shadow:0 8px 20px #0006}.slot.red{color:#c1272d}.empty{color:#b8c6d7;font-size:13px;text-align:center}.phase{text-align:center;margin-top:8px;color:var(--muted);font-size:13px}.decl-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.decl-buttons .btn{min-height:44px;padding:0}.hand{display:flex;flex-wrap:wrap;gap:9px}.card{width:64px;height:94px;border:2px solid #d9dee8;border-radius:11px;background:#fff;color:#101827;display:flex;flex-direction:column;justify-content:space-between;padding:7px;font-weight:950;cursor:pointer;box-shadow:0 7px 16px #0004;transition:.15s}.card:hover{transform:translateY(-7px)}.card.red{color:#c1272d}.card:disabled{opacity:.45;cursor:not-allowed;transform:none}.hint{color:var(--muted);font-size:12px;margin:9px 0}.hidden{display:none!important}.error{margin-top:12px;padding:10px;border-radius:11px;background:#4d1f27;color:#ffb1b8;font-size:13px}.footer{text-align:center;color:#62758d;font-size:11px;margin-top:18px}
@media(max-width:900px){.game{grid-template-columns:1fr}.tablebox{min-height:430px}.players{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.app{padding:12px 10px 25px}.topbar{margin-bottom:10px}.hero{padding:30px 16px 20px}.hero h1{letter-spacing:-2px}.actions{grid-template-columns:1fr}.roomhead{padding:18px 16px;align-items:flex-start}.players{padding:14px 16px;grid-template-columns:1fr 1fr;gap:8px}.player{min-height:105px;padding:12px}.room-actions{padding:0 16px 16px}.pad{padding:16px}.felt{width:92%;border-width:7px}.slot{width:78px;height:108px}.card{width:58px;height:86px}.decl-buttons{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div class="app"><div class="topbar"><div class="brand"><div class="logo">♠</div><span>PLANOWANIE</span></div><div class="status" id="status">Łączenie…</div></div>
<section id="home" class="panel"><div class="hero"><h1>Planowanie</h1><p>Klasyczna gra karciana online. Stwórz pokój i zagraj ze znajomymi.</p><div class="form"><div class="field"><label>Twoje imię</label><input id="name" maxlength="18" autocomplete="nickname" placeholder="np. Kuba"></div><div class="field"><label>Kod pokoju</label><input id="code" maxlength="6" autocapitalize="characters" placeholder="np. A1B2C3"></div><div class="actions"><button class="btn" id="create">Utwórz pokój</button><button class="btn secondary" id="join">Dołącz do pokoju</button></div><div id="homeMsg" class="message"></div></div></div></section>
<section id="lobby" class="panel hidden"><div class="roomhead"><div><div class="room-title">Pokój</div><div class="roomcode" id="roomCode">------</div><div class="roomsub">Udostępnij kod znajomym</div></div><button class="copy" id="copy">Kopiuj kod</button></div><div id="players" class="players"></div><div class="room-actions"><button class="btn" id="start">Rozpocznij grę</button><div id="lobbyMsg" class="message"></div></div></section>
<section id="game" class="hidden"><div class="game"><aside class="side box"><h3>Wyniki</h3><div id="score"></div></aside><main class="main box tablebox"><div class="roundline"><div class="round">Runda <span id="round">1</span></div><div class="trump">Atut: <b id="trump">—</b></div></div><div class="table"><div class="felt" id="trick"><div class="empty">Stół jest pusty</div></div></div><div class="phase" id="phase">—</div></main><aside class="side box"><h3 id="declTitle">Twoja deklaracja</h3><div id="decl"></div><hr style="border:0;border-top:1px solid #203650;margin:18px 0"><h3>Twoje karty</h3><div class="hint">Kliknij kartę, aby ją zagrać.</div><div id="hand" class="hand"></div></aside></div><div id="gameMsg" class="error hidden"></div></section><div class="footer">Planowanie • 2–4 graczy</div></div>
<script src="config.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>
const $=id=>document.getElementById(id);const socket=io(window.PLANOWANIE_SERVER,{transports:['websocket','polling']});let myId=localStorage.getItem('planowaniePlayerId')||crypto.randomUUID();localStorage.setItem('planowaniePlayerId',myId);let st=null;function show(id){['home','lobby','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function msg(t){$('homeMsg').textContent=t||'';$('lobbyMsg').textContent=t||'';if(t){$('gameMsg').textContent=t;$('gameMsg').classList.remove('hidden')}else $('gameMsg').classList.add('hidden')}
socket.on('connect',()=>{$('status').textContent='● Połączono';$('status').style.color='#35c98b'});socket.on('disconnect',()=>{$('status').textContent='● Rozłączono';$('status').style.color='#ff6b6b'});socket.on('roomCreated',c=>{show('lobby');$('roomCode').textContent=c;msg('')});socket.on('errorMsg',msg);$('create').onclick=()=>socket.emit('createRoom',{name:$('name').value.trim()||'Gracz',token:myId});$('join').onclick=()=>socket.emit('joinRoom',{code:$('code').value.trim().toUpperCase(),name:$('name').value.trim()||'Gracz',token:myId});$('start').onclick=()=>socket.emit('startGame');$('copy').onclick=()=>navigator.clipboard?.writeText($('roomCode').textContent);
socket.on('state',s=>{st=s;myId=s.myId;localStorage.setItem('planowaniePlayerId',myId);const r=s.room;if(r.phase==='lobby'){show('lobby');$('roomCode').textContent=r.code;$('players').innerHTML=r.players.map((p,i)=>`<div class="player"><div class="avatar">${i===0?'♛':'♟'}</div>${i===0?'<span class="crown">👑</span>':''}<strong>${p.name}</strong><small class="${p.connected?'ready':''}">${i===0?'Gospodarz':'Gracz '+(i+1)} · ${p.connected?'online':'łączenie'}</small></div>`).join('');$('start').disabled=!(r.players[0]?.id===myId&&r.players.length>=2);return}show('game');$('round').textContent=r.round;$('trump').textContent=r.trump?`${r.trump.r}${r.trump.s}`:'—';$('phase').innerHTML=r.phase==='declaration'?(r.currentDeclarer===myId?'<span class="turn">● Twoja kolej — wybierz deklarację</span>':'Czekaj na deklaracje…'):(r.currentPlayer===myId?'<span class="turn">● Twoja kolej — zagraj kartę</span>':'Czekaj na ruch…');$('score').innerHTML=r.players.map(p=>`<div class="score-row ${p.id===myId?'me':''}"><span>${p.name}${p.id===myId?' • Ty':''}</span><span>${p.score} pkt</span><span class="pill">${p.won} lew</span></div>`).join('');$('trick').innerHTML=r.trick.length?r.trick.map(t=>{let p=r.players.find(x=>x.id===t.player);return `<div class="slot ${t.card.s==='♥'||t.card.s==='♦'?'red':''}"><small>${p?.name||''}</small><strong style="font-size:28px">${t.card.r}</strong><span>${t.card.s}</span></div>`}).join(''):'<div class="empty">Stół jest pusty</div>';const me=r.players.find(p=>p.id===myId);if(r.phase==='declaration'&&r.currentDeclarer===myId&&me?.decl==null){let total=r.players.reduce((a,p)=>a+(p.decl??0),0),h='<div class="hint">Wybierz liczbę lew:</div><div class="decl-buttons">';for(let n=0;n<=r.handSize;n++)if(total+n!==r.handSize)h+=`<button class="btn" data-n="${n}">${n}</button>`;h+='</div>';$('decl').innerHTML=h;$('decl').querySelectorAll('button').forEach(b=>b.onclick=()=>socket.emit('declare',Number(b.dataset.n)))}else $('decl').innerHTML=`<div class="hint">${me?.decl==null?'Czekaj na swoją kolej…':'Twoja deklaracja: '+me.decl}</div>`;const can=r.phase==='play'&&r.currentPlayer===myId;$('hand').innerHTML=s.hand.map((c,i)=>`<button class="card ${c.s==='♥'||c.s==='♦'?'red':''}" ${can?'':'disabled'} data-i="${i}"><span>${c.r}</span><span>${c.s}</span></button>`).join('');$('hand').querySelectorAll('button').forEach(b=>b.onclick=()=>socket.emit('play',s.hand[Number(b.dataset.i)]));});
</script></body></html>
