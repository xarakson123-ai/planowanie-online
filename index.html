<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planowanie — Online</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--line:#2b3a52;--text:#edf2f7;--muted:#94a3b8;--blue:#60a5fa;--gold:#f7c948;--paper:#f5eedf;--ink:#2a241c;--red:#d95858}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#203556,#0b1220 62%);color:var(--text);font-family:system-ui,Segoe UI,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:rgba(18,29,48,.96);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 50px #0004}.home{max-width:820px;margin:70px auto}.home h1{font-size:48px;margin:0}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:14px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#0a1322;color:#fff}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--blue);font-weight:800;cursor:pointer}.btn.dark{background:#26344a;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.badge{padding:7px 10px;border-radius:999px;background:#1d2b40;color:#cfe4ff}.lobbyPlayers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.pl{background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:13px}.gamegrid{display:grid;grid-template-columns:1fr 340px;gap:15px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.trump{font-size:30px}.red{color:#ef4444}.sortbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.sortbar .active{outline:2px solid var(--gold)}.hand{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-end;gap:0;margin-top:18px;padding:18px 18px 30px;min-height:145px;overflow-x:auto;overflow-y:visible;scrollbar-width:thin}.hand .playing{flex:0 0 75px;margin-left:-40px;position:relative;transition:transform .15s ease,margin .15s ease;z-index:1}.hand .playing:first-child{margin-left:0}.hand .playing:hover{transform:translateY(-16px) rotate(0deg);z-index:20;margin-left:-34px;margin-right:6px}.playing{width:75px;height:112px;background:#fbfaf7;color:#111;border:2px solid #ded7c9;border-radius:11px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-weight:900;box-shadow:0 7px 17px #0004;cursor:pointer}.playing.disabled{opacity:.35;cursor:not-allowed;transform:none}.deal-overlay{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:100;opacity:0;background:rgba(3,8,18,.72);backdrop-filter:blur(3px)}.deal-overlay.show{animation:fadeDeal 3.8s ease both}.deal-stack{width:82px;height:116px;border-radius:12px;background:repeating-linear-gradient(135deg,#24466f 0 8px,#356392 8px 16px);border:3px solid #b8d7f5;box-shadow:0 18px 45px #000b;position:relative}.deal-stack:before{content:"";position:absolute;inset:7px;border:2px solid #b8d7f5;border-radius:8px}.deal-stack:after{content:"♠";position:absolute;inset:0;display:grid;place-items:center;color:#e7f3ff;font-size:36px;font-weight:900}.deal-txt{position:absolute;margin-top:185px;font-weight:900;font-size:21px;text-shadow:0 2px 10px #000}.deal-card{position:absolute;left:50%;top:50%;width:82px;height:116px;margin:-58px 0 0 -41px;border-radius:12px;background:repeating-linear-gradient(135deg,#24466f 0 8px,#356392 8px 16px);border:3px solid #b8d7f5;box-shadow:0 12px 25px #0008;opacity:0;animation:flyCard 1.7s cubic-bezier(.2,.8,.2,1) both}.deal-card:after{content:"♠";position:absolute;inset:0;display:grid;place-items:center;color:#e7f3ff;font-size:32px}.deal-card.c1{--dx:-360px;--dy:-135px;animation-delay:.18s}.deal-card.c2{--dx:-220px;--dy:165px;animation-delay:.55s}.deal-card.c3{--dx:0px;--dy:-190px;animation-delay:.92s}.deal-card.c4{--dx:220px;--dy:165px;animation-delay:1.29s}@keyframes flyCard{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.72)}12%{opacity:1}78%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(720deg) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(780deg) scale(.96)}}@keyframes fadeDeal{0%{opacity:0}6%{opacity:1}90%{opacity:1}100%{opacity:0}}.card-back{background:repeating-linear-gradient(135deg,#24466f 0 7px,#356392 7px 14px)!important;color:#e7f3ff!important;border-color:#b8d7f5!important}.card-back .big{font-size:28px!important}.playing .big{font-size:28px}.table{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table .slot{min-height:130px;background:#0a1322;border:1px dashed #43546e;border-radius:14px;padding:10px;text-align:center}.paper{background:linear-gradient(180deg,#faf3e4,#efe4c9);color:var(--ink);border-radius:7px;padding:17px;box-shadow:0 13px 24px #0005;transform:rotate(.3deg);border:1px solid #d2c5a9}.paper h3{margin:0 0 10px;font-family:Georgia,serif}.paper table{width:100%;border-collapse:collapse;font-family:Georgia,serif;font-size:13px}.paper th,.paper td{padding:6px;border-bottom:1px dashed #c4b79c;text-align:center}.paper th{font-weight:900}.paper .total{font-weight:900}.status{padding:11px;border-radius:10px;background:#0a1322;color:#cdd8e7;margin-bottom:11px}.error{background:#481d22;color:#fecaca}.phase{padding:25px;text-align:center;background:#0a1322;border-radius:14px;border:1px dashed #43546e;margin-bottom:12px}.phase h2{margin-top:0}.log{max-height:150px;overflow:auto;color:#9fb0c4;font-size:12px;margin-top:10px}.rules{font-size:12px;color:#77879a;margin-top:16px}@media(max-width:950px){.gamegrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.lobbyPlayers{grid-template-columns:1fr 1fr}}@media(max-width:560px){.hand{justify-content:flex-start;padding-left:10px;padding-right:10px;min-height:125px}.hand .playing{flex-basis:62px;width:62px;height:94px;margin-left:-31px}.hand .playing:first-child{margin-left:0}.hand .playing:hover{margin-left:-26px;margin-right:5px}.hand{gap:7px}.playing{width:62px;height:94px}}
</style>
</head>
<body>
<div class="wrap"><section id="home" class="panel home"><h1>♠ Planowanie</h1><p class="muted">Oh Hell / Windykacja — pełna talia, pokoje online i kartka do zapisywania lew.</p><div class="grid"><div class="field"><label>Twoje imię</label><input id="name" maxlength="18" placeholder="np. Kuba"></div><div class="field"><label>Kod pokoju (przy dołączaniu)</label><input id="code" maxlength="6" placeholder="np. A1B2C3"></div></div><div class="row" style="margin-top:15px"><button class="btn" id="create">Utwórz pokój</button><button class="btn dark" id="join">Dołącz do pokoju</button></div><p id="connectionStatus" class="muted">Łączenie z serwerem…</p><p id="homeError"></p></section><section id="lobby" class="hidden"><div class="panel"><div class="top"><div><h2 style="margin:0">Pokój <span id="roomCode"></span></h2><p class="muted">Podaj kod znajomym.</p></div><span class="badge">2–4 graczy</span></div><div class="lobbyPlayers" id="lobbyPlayers"></div><div class="status" id="lobbyStatus"></div><div class="row"><button class="btn" id="start">Rozpocznij grę</button><button class="btn dark" id="copy">Kopiuj kod</button></div></div></section><section id="game" class="hidden"><div class="top"><div><h2 style="margin:0">♠ Planowanie</h2><span class="muted">Runda <b id="round"></b></span></div><div class="badge">Atut: <span id="trump" class="trump"></span></div></div><div class="gamegrid"><main><div class="panel"><div class="bar"><div><b id="phase"></b></div><div class="status" style="margin:0">Twoja deklaracja: <b id="myDecl">—</b></div></div><div id="declArea"></div><div id="playArea"></div></div><div class="panel" style="margin-top:15px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3 style="margin:0">Twoja ręka</h3><div class="sortbar"><span class="muted" style="font-size:12px">Sortuj:</span><button id="sortRank" class="btn dark" type="button">Liczby</button><button id="sortSuit" class="btn dark" type="button">Kolory</button></div></div><div id="hand" class="hand"></div><div id="handMsg" class="muted" style="margin-top:10px"></div></div></main><aside><div class="paper"><h3>📄 Kartka wyników</h3><table><thead><tr><th>Gracz</th><th>Licz.</th><th>Lewy</th><th>Pkt</th></tr></thead><tbody id="sheet"></tbody></table></div><div class="panel" style="margin-top:15px"><h3 style="margin-top:0">Stół</h3><div id="trick" class="table"></div><div class="log" id="log"></div></div></aside></div></section></div><div id="dealAnim" class="deal-overlay"><div class="deal-stack"></div><span class="deal-card c1"></span><span class="deal-card c2"></span><span class="deal-card c3"></span><span class="deal-card c4"></span><div class="deal-txt">Tasowanie i rozdawanie…</div></div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="config.js"></script><script>
const SERVER=window.PLANOWANIE_SERVER||location.origin;
if(typeof io!=='function'){document.getElementById('connectionStatus').textContent='Błąd: nie załadował się klient Socket.IO.';document.getElementById('connectionStatus').style.color='#f87171';throw new Error('Socket.IO client unavailable')}
const socket=io(SERVER,{transports:['polling'],upgrade:false,reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:1000,reconnectionDelayMax:5000,timeout:10000,forceNew:true});let myId=null,last=null,lastRound=0,dealLock=false,dealTimer=null,sortMode='rank',pendingSocketAction=null,pendingSocketTimer=null;
const $=id=>document.getElementById(id);function makeToken(){try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2)}}let playerToken=localStorage.getItem('planowaniePlayerToken');if(!playerToken){playerToken=makeToken();localStorage.setItem('planowaniePlayerToken',playerToken)}function savedRoom(){return localStorage.getItem('planowanieRoom')||''}function saveRoom(code){if(code)localStorage.setItem('planowanieRoom',code)}function show(id){['home','lobby','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function socketStatus(text,bad=false){const el=$('connectionStatus');if(!el)return;el.textContent=text;el.style.color=bad?'#f87171':''}
function emitWhenConnected(event,payload){if(socket.connected){socket.emit(event,payload);return}pendingSocketAction={event,payload};socketStatus('Łączenie z serwerem…');clearTimeout(pendingSocketTimer);pendingSocketTimer=setTimeout(()=>{if(!socket.connected&&pendingSocketAction){pendingSocketAction=null;socketStatus('Nie można połączyć z serwerem.',true);$('homeError').textContent='Serwer gry jest chwilowo niedostępny. Spróbuj ponownie za chwilę.';$('homeError').className='status error'}},15000)}
socket.on('connect',()=>{socketStatus('Połączono z serwerem.');if(pendingSocketAction){const a=pendingSocketAction;pendingSocketAction=null;clearTimeout(pendingSocketTimer);socket.emit(a.event,a.payload)}const code=savedRoom();if(code)socket.emit('resume',{code,token:playerToken})});socket.on('connect_error',err=>{console.error('Socket.IO connect_error:',err);socketStatus('Błąd połączenia: '+(err&&err.message?err.message:'nieznany błąd'),true)});socket.on('disconnect',reason=>{console.warn('Socket.IO disconnect:',reason);socketStatus('Brak połączenia — ponawiam…',true)});socket.on('roomCreated',code=>{clearTimeout(pendingSocketTimer);pendingSocketAction=null;saveRoom(code);$('roomCode').textContent=code;show('lobby');$('homeError').textContent=''});socket.on('roomJoined',code=>{clearTimeout(pendingSocketTimer);pendingSocketAction=null;saveRoom(code);$('roomCode').textContent=code;show('lobby');$('homeError').textContent=''});socket.on('resumed',code=>{saveRoom(code)});socket.on('errorMsg',m=>{pendingSocketAction=null;clearTimeout(pendingSocketTimer);for(const id of ['homeError','lobbyStatus','handMsg'])if($(id)){$(id).textContent=m;if(id!=='handMsg')$(id).className='status error'}});
$('sortRank').onclick=()=>{sortMode='rank';if(last)render(last)};$('sortSuit').onclick=()=>{sortMode='suit';if(last)render(last)};$('create').onclick=()=>{const name=$('name').value.trim()||'Gracz';emitWhenConnected('createRoom',{name,token:playerToken})};$('join').onclick=()=>{const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim()||'Gracz';emitWhenConnected('joinRoom',{code,name,token:playerToken})};$('start').onclick=()=>socket.emit('startGame');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('roomCode').textContent);$('lobbyStatus').textContent='Kod skopiowany.'}catch{}};
function render(s){last=s;lastRound=s.round||1;/* dalsza logika gry pozostaje bez zmian */}
socket.on('state',render);socket.emit('requestState');
</script></body></html>
